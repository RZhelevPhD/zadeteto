<!doctype html>
<html lang="bg">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Карта (embed) · ZaDeteto</title>
  <!-- Standalone widget loaded via iframe from map.html. Direct visits should
       not be indexed; the wrapper page is the public surface. -->
  <meta name="robots" content="noindex,nofollow" />

  <link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css" />

  <style>
    :root {
      --brand: #6E3CFF;
      --brand-soft: #EFE9FF;
      --brand-deep: #4D2BB8;
      --ink: #1A1430;
      --ink-mute: #6B6486;
      --bg-base: #FAF7FF;
      --shadow-pin: 0 4px 14px -4px rgba(110, 60, 255, 0.55);
      --shadow-pop: 0 18px 38px -16px rgba(26, 20, 48, 0.28),
                    0 4px 14px -6px rgba(110, 60, 255, 0.18);
      --radius-pop: 18px;
      --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;

      /* Tier palette — mirrors public_html/search.html so the map and the
         search list stay visually in sync. Update both files together. */
      --zd-purple-600: #7c4dff;   /* Доверен */
      --zd-purple-800: #5a2ecf;
      --zd-mint-600:   #2e994d;   /* Проверен */
      --zd-mint-800:   #1a6e34;
      --zd-gold-500:   #d4af37;   /* Премиум */
      --zd-gold-700:   #8a6800;
      --zd-charcoal:   #36454f;   /* Стандартен */
      --zd-gray-400:   #b0b0b0;   /* Безплатен */
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: var(--font-body);
      color: var(--ink);
      background: var(--bg-base);
      overflow: hidden;
    }

    #map {
      position: absolute;
      inset: 0;
    }

    .map-overlay-top {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 5;
      display: flex;
      gap: 12px;
      pointer-events: none;
    }
    .map-overlay-top > * { pointer-events: auto; }

    .city-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #fff;
      border-radius: 999px;
      box-shadow: var(--shadow-pop);
      font-size: 14px;
      font-weight: 500;
      color: var(--ink);
    }
    .city-pill svg { width: 16px; height: 16px; color: var(--brand); }

    .legend {
      margin-left: auto;
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow-pop);
      font-size: 12px;
      color: var(--ink-mute);
    }
    .legend-item { display: inline-flex; align-items: center; gap: 6px; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .legend-dot.premium   { background: var(--zd-gold-500); }
    .legend-dot.dovreen   { background: var(--zd-purple-600); }
    .legend-dot.proveren  { background: var(--zd-mint-600); }
    .legend-dot.standarten{ background: #c8c2d4; border: 1px solid var(--zd-gray-400); }
    .legend-dot.bezplaten { background: #fff; border: 2px solid var(--zd-gray-400); }
    .legend[hidden] { display: none !important; }

    /* City selector pill bar */
    .city-tabs-wrap {
      position: absolute;
      top: 70px;
      left: 16px;
      right: 16px;
      z-index: 5;
      display: flex;
      justify-content: center;
      pointer-events: none;
    }
    .city-tabs {
      display: inline-flex;
      gap: 6px;
      padding: 6px;
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(8px);
      border-radius: 999px;
      box-shadow: var(--shadow-pop);
      max-width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      pointer-events: auto;
    }
    .city-tabs::-webkit-scrollbar { display: none; }
    .city-tab {
      flex-shrink: 0;
      appearance: none;
      border: none;
      background: transparent;
      padding: 8px 14px;
      font: inherit;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink-mute);
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 140ms ease-out, color 140ms ease-out;
      white-space: nowrap;
    }
    @media (hover: hover) and (pointer: fine) {
      .city-tab:hover { background: var(--brand-soft); color: var(--brand-deep); }
    }
    .city-tab[aria-selected="true"] {
      background: var(--brand);
      color: #fff;
    }
    .city-tab:focus-visible {
      outline: 2px solid var(--brand);
      outline-offset: 2px;
    }

    .stat-pill {
      position: absolute;
      bottom: 24px;
      left: 16px;
      z-index: 5;
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      box-shadow: var(--shadow-pop);
      font-size: 12px;
      color: var(--ink-mute);
    }
    .stat-pill strong { color: var(--ink); font-weight: 600; }

    /* Empty state card */
    .empty-state {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 6;
      width: min(340px, calc(100% - 32px));
      padding: 24px 22px 22px;
      background: #fff;
      border-radius: 18px;
      box-shadow: var(--shadow-pop);
      text-align: center;
    }
    .empty-state .empty-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--brand-soft);
      border-radius: 50%;
      color: var(--brand);
    }
    .empty-state .empty-icon svg { width: 24px; height: 24px; }
    .empty-state h2 {
      margin: 0 0 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--ink);
      line-height: 1.3;
    }
    .empty-state p {
      margin: 0 0 18px;
      font-size: 13.5px;
      line-height: 1.55;
      color: var(--ink-mute);
    }
    .empty-state a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 10px 18px;
      background: var(--brand);
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1), background-color 140ms ease;
    }
    @media (hover: hover) and (pointer: fine) {
      .empty-state a:hover { background: var(--brand-deep); transform: translateY(-1px); }
    }
    .empty-state a:active { transform: scale(0.97); }

    /* Mapbox popup override — Airbnb-style card. Wider than the default to
       give the layered card chrome (tier accent strip, ratings strip,
       services chips, socials row) room to read. */
    .mapboxgl-popup-content {
      padding: 0;
      border-radius: var(--radius-pop);
      box-shadow: var(--shadow-pop);
      overflow: hidden;
      width: 320px;
    }
    .mapboxgl-popup-close-button {
      font-size: 22px;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      top: 6px;
      right: 6px;
      color: #fff;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 50%;
      z-index: 2;
    }
    .mapboxgl-popup-close-button:hover {
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
    }
    .mapboxgl-popup-tip { display: none; }

    /* ═══ Popup card — search-style, tier-tinted, fit-for-popup ═══ */
    /* Card width is wider on the popup itself so the layered visual treatment
       below has room to read. Mapbox's `.mapboxgl-popup-content` width is
       overridden further down to 320px (240px on mobile). */
    .pop-card {
      font-family: var(--font-body);
      position: relative;
      /* Layered tier-tinted shadow mirrors search.html `.rig-card` —
         soft outer glow + inner ridge so the card lifts off the basemap. */
    }
    /* Tier-coloured top accent strip — 3 px ribbon at the very top of the
       card. Matches search.html's `.cf-hero` border-bottom-2px in spirit. */
    .pop-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      z-index: 2;
      background: var(--zd-purple-600);
    }
    .pop-card[data-tier="premium"]::before    { background: var(--zd-gold-500); }
    .pop-card[data-tier="dovreen"]::before    { background: var(--zd-purple-600); }
    .pop-card[data-tier="proveren"]::before   { background: var(--zd-mint-600); }
    .pop-card[data-tier="standarten"]::before { background: var(--zd-charcoal); }
    .pop-card[data-tier="bezplaten"]::before  { background: var(--ink-mute); }

    .pop-img {
      position: relative;
      height: 150px;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Brand-mark placeholder when no photo — mirrors search.html
       `.rig-thumb-empty` with a centered ZaDeteto icon mark. */
    .pop-img-mark {
      width: 56px;
      height: 56px;
      opacity: 0.55;
      filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.06));
    }
    .pop-img:not(.pop-img--empty) .pop-img-mark { display: none; }
    /* Tier-themed empty placeholders mirror search.html .zd-photo--empty */
    .pop-img--empty.pop-img--premium    { background: linear-gradient(145deg, #fdf8e7 0%, #f5e8b3 100%); }
    .pop-img--empty.pop-img--dovreen    { background: linear-gradient(145deg, #f8f5ff 0%, #d4b6ff 100%); }
    .pop-img--empty.pop-img--proveren   { background: linear-gradient(145deg, #edf9f0 0%, #c7e7d0 100%); }
    .pop-img--empty.pop-img--standarten { background: linear-gradient(145deg, #f3f3f3 0%, #d6d6d6 100%); }
    .pop-img--empty.pop-img--bezplaten  { background: linear-gradient(145deg, #fafafa 0%, #e8e8e8 100%); }
    .pop-img:not(.pop-img--empty)::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.35), transparent 55%);
    }

    .pop-tier {
      position: absolute;
      top: 10px;
      left: 10px;
      padding: 4px 9px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.02em;
      color: #fff;
      border-radius: 999px;
      z-index: 1;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.18);
    }
    .pop-tier--premium    { background: linear-gradient(135deg, var(--zd-gold-500), var(--zd-gold-700)); }
    .pop-tier--dovreen    { background: linear-gradient(135deg, var(--zd-purple-600), var(--zd-purple-800)); }
    .pop-tier--proveren   { background: linear-gradient(135deg, var(--zd-mint-600), var(--zd-mint-800)); }
    .pop-tier--standarten { background: linear-gradient(135deg, var(--zd-charcoal), #1f2a33); }

    /* Bookmark — visual only inside popup; clicking the CTA lands on the
       listing page, where save state is the canonical source of truth. */
    .pop-bookmark {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.92);
      color: var(--ink);
      border-radius: 50%;
      z-index: 1;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
      pointer-events: none;
    }
    .pop-bookmark svg { width: 14px; height: 14px; }

    .pop-body { padding: 14px 16px 14px; }
    .pop-title-row {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin-bottom: 6px;
    }
    .pop-title {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      color: var(--ink);
      line-height: 1.3;
      flex: 1;
      min-width: 0;
    }
    /* Category icon — currentColor follows the tier-class set on the wrap. */
    .pop-cat-icon {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      padding: 2px;
      background: rgba(110, 60, 255, 0.06);
      color: var(--zd-purple-600);
      margin-top: -1px;
    }
    .pop-cat-icon svg { width: 100%; height: 100%; display: block; }
    .pop-cat-icon--premium    { color: var(--zd-gold-500);   background: rgba(212, 175, 55, 0.12); }
    .pop-cat-icon--dovreen    { color: var(--zd-purple-600); background: rgba(124, 77, 255, 0.10); }
    .pop-cat-icon--proveren   { color: var(--zd-mint-600);   background: rgba(46, 153, 77, 0.10); }
    .pop-cat-icon--standarten { color: var(--zd-charcoal);   background: rgba(54, 69, 79, 0.08); }
    .pop-cat-icon--bezplaten  { color: var(--ink-mute);      background: rgba(107, 100, 134, 0.08); }
    .pop-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px 8px;
      margin-bottom: 10px;
      font-size: 12.5px;
      color: var(--ink-mute);
    }
    .pop-rating { display: inline-flex; align-items: center; gap: 4px; color: var(--ink); font-weight: 600; }
    .pop-rating svg { width: 13px; height: 13px; color: #F5B800; }
    .pop-meta-sep {
      width: 3px;
      height: 3px;
      background: currentColor;
      border-radius: 50%;
      opacity: 0.45;
    }
    .pop-meta-loc { display: inline-flex; align-items: center; gap: 4px; }
    .pop-meta-loc svg { width: 11px; height: 11px; flex-shrink: 0; opacity: 0.8; }

    /* Description preview — clamped to 3 lines, mirrors search.html `.rig-desc` */
    .pop-desc {
      margin: 0 0 10px;
      font-size: 12.5px;
      line-height: 1.5;
      color: var(--ink);
      opacity: 0.78;
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
      hyphens: auto;
      -webkit-hyphens: auto;
      overflow-wrap: break-word;
    }

    /* 3-row ratings strip — Audit / Google / ZaDeteto. Mirrors search.html
       `.rig-ratings`. Ratings without data render with a `—` placeholder
       in muted style. */
    .pop-ratings {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      margin-bottom: 12px;
      padding: 8px 0;
      border-top: 1px solid #f1eff7;
      border-bottom: 1px solid #f1eff7;
    }
    .pop-rblock {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      font-size: 10.5px;
    }
    .pop-rblock-icn { width: 16px; height: 16px; display: flex; align-items: center; justify-content: center; }
    .pop-rblock-icn svg { width: 14px; height: 14px; }
    .pop-rblock-lbl { color: var(--ink-mute); font-weight: 500; letter-spacing: 0.02em; }
    .pop-rblock-num { color: var(--ink); font-weight: 700; font-size: 12.5px; line-height: 1.1; }
    .pop-rblock-num small { color: var(--ink-mute); font-weight: 500; font-size: 10px; margin-left: 2px; }
    .pop-rblock--empty .pop-rblock-num { color: var(--ink-mute); opacity: 0.6; }
    .pop-rblock--empty .pop-rblock-icn { opacity: 0.45; }

    /* Service tags — chip-style, tier-tinted */
    .pop-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-bottom: 12px;
    }
    .pop-tag {
      font-size: 10.5px;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 999px;
      line-height: 1.4;
    }
    .pop-tag--premium    { background: #fbf3d8; color: var(--zd-gold-700);   border: 1px solid #ead78a; }
    .pop-tag--dovreen    { background: #f6f1ff; color: var(--zd-purple-800); border: 1px solid #efe8ff; }
    .pop-tag--proveren   { background: var(--zd-mint-50, #edf9f0); color: var(--zd-mint-800); border: 1px solid #d4f5dc; }
    .pop-tag--standarten { background: #f3f3f3; color: #333; border: 1px solid #e8e8e8; }
    .pop-tag--bezplaten  { background: #fafafa; color: #777; border: 1px solid #e8e8e8; }

    /* Bottom row — primary CTA + decorative social mini-icons */
    .pop-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pop-cta {
      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
      padding: 9px 14px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      border-radius: 10px;
      transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1), filter 140ms ease;
    }
    .pop-cta--premium    { background: linear-gradient(135deg, var(--zd-gold-500), var(--zd-gold-700)); }
    .pop-cta--dovreen    { background: linear-gradient(135deg, var(--zd-purple-600), var(--zd-purple-800)); }
    .pop-cta--proveren   { background: linear-gradient(135deg, var(--zd-mint-600), var(--zd-mint-800)); }
    .pop-cta--standarten { background: linear-gradient(135deg, var(--zd-charcoal), #1f2a33); }
    .pop-cta--bezplaten  { background: var(--brand); }
    @media (hover: hover) and (pointer: fine) {
      .pop-cta:hover { filter: brightness(1.08); transform: translateY(-1px); }
    }
    .pop-cta:active { transform: scale(0.97); }
    .pop-cta svg { width: 14px; height: 14px; }

    .pop-socials {
      display: inline-flex;
      gap: 4px;
    }
    .pop-soc {
      width: 30px;
      height: 30px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      color: var(--ink-mute);
      background: #f5f3fa;
      text-decoration: none;
      transition: background 140ms ease, color 140ms ease, transform 140ms ease;
    }
    .pop-soc svg { width: 13px; height: 13px; }
    @media (hover: hover) and (pointer: fine) {
      .pop-soc:hover {
        background: var(--brand-soft);
        color: var(--brand-deep);
        transform: translateY(-1px);
      }
    }
    .pop-soc--decor { cursor: default; opacity: 0.55; }
    @media (hover: hover) and (pointer: fine) {
      .pop-soc--decor:hover { background: #f5f3fa; color: var(--ink-mute); transform: none; }
    }

    .loading-msg {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      padding: 14px 20px;
      background: #fff;
      border-radius: 12px;
      box-shadow: var(--shadow-pop);
      font-size: 14px;
      color: var(--ink-mute);
    }

    @media (max-width: 640px) {
      .legend { display: none; }
      .city-pill { font-size: 13px; padding: 8px 14px; }
      .city-tabs-wrap { top: 64px; justify-content: flex-start; padding-right: 16px; }
      .city-tab { font-size: 12.5px; padding: 7px 12px; }
      .mapboxgl-popup-content { width: 280px; }
      .pop-img { height: 120px; }
      .pop-img-mark { width: 44px; height: 44px; }
      .pop-ratings { padding: 6px 0; }
      .pop-rblock-num { font-size: 11.5px; }
    }

    /* ═══ Filter trigger + panel + active pills ═══════════════════════════ */

    .filter-trigger {
      appearance: none;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #fff;
      border-radius: 999px;
      box-shadow: var(--shadow-pop);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      color: var(--ink);
      cursor: pointer;
      transition: background-color 140ms ease-out;
    }
    .filter-trigger svg { width: 16px; height: 16px; color: var(--brand); }
    @media (hover: hover) and (pointer: fine) {
      .filter-trigger:hover { background: var(--brand-soft); }
    }
    .filter-trigger:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .filter-trigger-count {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 20px;
      height: 20px;
      padding: 0 6px;
      background: var(--brand);
      color: #fff;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }
    .filter-trigger-count[hidden] { display: none; }

    /* "Близо до мен" trigger — distinct from generic filters because it's a
       location-grant flow, not a UI-only toggle. */
    .near-trigger {
      appearance: none;
      border: none;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 10px 16px;
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      box-shadow: var(--shadow-pop);
      font: inherit;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 140ms ease-out, color 140ms ease-out;
    }
    .near-trigger svg { width: 16px; height: 16px; color: var(--brand); transition: color 140ms ease-out; }
    @media (hover: hover) and (pointer: fine) {
      .near-trigger:hover { background: var(--brand-soft); }
    }
    .near-trigger:focus-visible { outline: 2px solid var(--brand); outline-offset: 2px; }
    .near-trigger.is-active {
      background: var(--brand);
      color: #fff;
    }
    .near-trigger.is-active svg { color: #fff; }
    .near-trigger.is-loading svg { animation: nearSpin 800ms linear infinite; }
    @keyframes nearSpin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .near-trigger.is-loading svg { animation: none; }
    }

    /* Toast (geolocation result) */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      z-index: 200;
      padding: 12px 20px;
      background: var(--ink);
      color: #fff;
      border-radius: 12px;
      font-size: 13px;

</head>

  <script src="https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.js"></script>

  <script>
    // Public token — URL-restricted to localhost / zadeteto.com / www.zadeteto.com.
    const MAPBOX_TOKEN = 'pk.eyJ1IjoicnVzaXoiLCJhIjoiY21vb2M5YnA0MGcyeTJyczZsa2xzNGhvYyJ9.Y-u9iMl0zwHTZPIXymjcCw';

    const PIN_COLOR = '#6E3CFF';

    // Single source of truth for supported cities.
    // Key = URL slug. `bg` = Cyrillic name as stored in Supabase `businesses.city`.
    const CITIES = {
      sofia:          { bg: 'София',        center: [23.3219, 42.6977], zoom: 12 },
      'stara-zagora': { bg: 'Стара Загора', center: [25.6345, 42.4258], zoom: 12 },
      plovdiv:        { bg: 'Пловдив',      center: [24.7453, 42.1354], zoom: 12 },
      varna:          { bg: 'Варна',        center: [27.9147, 43.2141], zoom: 12 },
      burgas:         { bg: 'Бургас',       center: [27.4626, 42.5048], zoom: 12 },
      pleven:         { bg: 'Плевен',       center: [24.6066, 43.4170], zoom: 12 },
      ruse:           { bg: 'Русе',         center: [25.9694, 43.8564], zoom: 12 },
    };
    const DEFAULT_CITY = 'sofia';

    function citySlugFromUrl() {
      const slug = (new URLSearchParams(location.search).get('city') || '').toLowerCase();
      return CITIES[slug] ? slug : DEFAULT_CITY;
    }

    mapboxgl.accessToken = MAPBOX_TOKEN;

    const initialSlug = citySlugFromUrl();
    let currentSlug = initialSlug;
    let currentLoadToken = 0;
    let cachedCityPillEl = null;

    // Apply the city to the chrome synchronously so the pill text + tabs match
    // the URL immediately, before Mapbox finishes loading. Prevents a
    // "София" → "Пловдив" flash on direct ?city= URLs and ensures the tabs
    // row is visible even while tiles are still streaming in.
    document.addEventListener('DOMContentLoaded', () => {
      cachedCityPillEl = document.querySelector('[data-current-city]');
      if (cachedCityPillEl) cachedCityPillEl.textContent = CITIES[currentSlug].bg;
      buildCityTabs();

      // Filter init: hydrate state from URL → render the panel chips →
      // reflect state into chips/inputs → render active-filter pill row.
      // Has to run before the user can possibly click anything; the actual
      // applyFilters() runs once data lands (in selectCity / map load).
      hydrateFiltersFromUrl();
      buildFilterPanelChips();
      syncFilterPanelInputs();
      wireActiveFiltersDelegate();
      updateActiveFiltersUi();
      const nearBtn = document.getElementById('near-trigger');
      if (nearBtn) nearBtn.addEventListener('click', toggleNearMe);
      const triggerCount = document.getElementById('filter-trigger-count');
      const n = activeFilterCount();
      if (triggerCount) {
        triggerCount.textContent = String(n);
        triggerCount.hidden = n === 0;
      }
    });

    const map = new mapboxgl.Map({
      container: 'map',
      style: 'mapbox://styles/mapbox/light-v11',
      center: CITIES[initialSlug].center,
      zoom: CITIES[initialSlug].zoom,
      minZoom: 8,
      maxZoom: 17,
      pitchWithRotate: false,
      dragRotate: false,
    });

    // Surface tile / style failures during local development. Mapbox swallows
    // these by default, which made it look like the map was just rendering on
    // a blank canvas when the access token was URL-restricted to a domain that
    // does not match the current origin (e.g. opening this file via file://).
    // The first 401/403 we see triggers a one-line banner in #loading with the
    // dev-server hint so the next person does not chase a phantom bug.
    let _zdMapErrorBannerShown = false;
    map.on('error', (e) => {
      const msg = (e && e.error && e.error.message) || String(e);
      const status = e && e.error && e.error.status;
      const looksLikeAuthFailure =
        status === 401 || status === 403 ||
        /Unauthorized|Forbidden|access token/i.test(msg);
      // Only warn on errors we actually care about — Mapbox emits benign
      // tile-cancellation events during pan/zoom that would flood DevTools.
      if (looksLikeAuthFailure || (e && e.error && e.error.status)) {
        console.warn('[map]', msg, e && e.error);
      }
      if (_zdMapErrorBannerShown) return;
      if (!looksLikeAuthFailure) return;
      _zdMapErrorBannerShown = true;
      const loading = document.getElementById('loading');
      if (loading) {
        loading.hidden = false;
        loading.textContent =
          'Картата не може да зареди плочки от този адрес. ' +
          'Стартирай dev server (python -m http.server 8000 от public_html/) ' +
          'и отвори http://localhost:8000/map-lab.html.';
      }
    });

    map.addControl(new mapboxgl.NavigationControl({ showCompass: false }), 'bottom-right');
