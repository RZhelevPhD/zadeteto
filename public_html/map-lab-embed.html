    // Spatially down-sample a list of point Features by bucketing them into
    // a `gridSize`×`gridSize` grid over their bounding box and keeping
    // ceil(cellSize × retentionRatio) features per cell. Unlike a flat
    // random sample, this preserves an even visual distribution across
    // neighbourhoods — dense areas stay visibly denser than sparse areas,
    // but every cell with ≥1 feature retains at least one pin.
    // Used to lighten Sofia's ~1338-row dataset for snappier initial paint.
    function spatialSample(features, gridSize, retentionRatio) {
      if (!features.length || gridSize < 1 || retentionRatio >= 1) return features;
      let minLng = Infinity, maxLng = -Infinity;
      let minLat = Infinity, maxLat = -Infinity;
      for (const f of features) {
        const [lng, lat] = f.geometry.coordinates;
        if (lng < minLng) minLng = lng;
        if (lng > maxLng) maxLng = lng;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
      }
      // Guard against zero-extent bbox (single point or all-coincident).
      const cellW = ((maxLng - minLng) / gridSize) || 1e-9;
      const cellH = ((maxLat - minLat) / gridSize) || 1e-9;
      const buckets = new Map();
      for (const f of features) {
        const [lng, lat] = f.geometry.coordinates;
        const cx = Math.min(gridSize - 1, Math.max(0, Math.floor((lng - minLng) / cellW)));
        const cy = Math.min(gridSize - 1, Math.max(0, Math.floor((lat - minLat) / cellH)));
        const key = cx * gridSize + cy;
        let cell = buckets.get(key);
        if (!cell) { cell = []; buckets.set(key, cell); }
        cell.push(f);
      }
      const out = [];
      for (const cell of buckets.values()) {
        const keep = Math.max(1, Math.ceil(cell.length * retentionRatio));
        // Deterministic subset — first N rows in Supabase return order.
        // Stable across reloads, which keeps the demo from feeling janky.
        for (let i = 0; i < keep; i++) out.push(cell[i]);
      }
      return out;
    }

    async function loadBusinessesFor(cityBg) {
      // Supabase JS client defaults to range 0-999. We explicitly request 0-4999 so
      // Sofia's 1338 published rows all render — `.limit()` alone is not enough
      // because PostgREST also applies the server-side `Prefer: count=...` cap.
      const { data, error } = await ZdSupabase
        .from('businesses')
        .select('slug,name,tier,city,address,lat,lng,google_rating,google_review_count,logo,gallery_urls,services,phone,email,website,facebook,instagram,visible_categories,age_groups,is_online,sop,description,audit_score')
        .eq('city', cityBg)
        .eq('published', true)
        .not('lat', 'is', null)
        .not('lng', 'is', null)
        // Stable row order is required for spatialSample's "deterministic
        // first-N within each cell" guarantee — without this, PostgREST
        // returns rows in implementation-defined heap order which can
        // change after VACUUM/UPDATE and make the demo flicker between
        // different visible subsets across reloads.
        .order('slug', { ascending: true })
        .range(0, 4999);

      if (error) {
        console.error('[map] supabase error', error);
        return null;
      }
      if (!data) return [];

      const features = data
        .filter(b => Number.isFinite(b.lat) && Number.isFinite(b.lng))
        // Drop Безплатен entirely — they shouldn't appear on the map per
        // product decision. They remain in the search list page but aren't
        // surfaced spatially. NULL tier is coerced to Безплатен upstream so
        // the same filter catches both.
        .filter(b => (b.tier || 'Безплатен') !== 'Безплатен')
        .map(b => {
          const galleryFirst = Array.isArray(b.gallery_urls) && b.gallery_urls.length
            ? b.gallery_urls[0] : null;
          return {
            type: 'Feature',
            geometry: { type: 'Point', coordinates: [b.lng, b.lat] },
            properties: {
              slug: b.slug,
              name: b.name,
              // Defensive coercion — rows with NULL tier render visually
              // identical to Безплатен (no badge, outlined pin).
              tier: b.tier || 'Безплатен',
              address: b.address,
              google_rating: b.google_rating,
              google_review_count: b.google_review_count,
              logo: b.logo,
              gallery_first: galleryFirst,
              // Mapbox serialises non-primitive feature properties to JSON
              // strings on read-back; stringify here and parse in popup +
              // featureMatches.
              services: JSON.stringify(Array.isArray(b.services) ? b.services : []),
              cats_raw: JSON.stringify(Array.isArray(b.visible_categories) ? b.visible_categories : []),
              // Pre-computed primary main category — drives the map-pin icon
              // layer (Mapbox `match` expression on `cats_main`). When no
              // rollup matches we fall back to CAT_FALLBACK_KEY so every pin
              // still renders a glyph (a generic star) instead of a featureless
              // dark dot. The fallback never escapes to the URL because
              // CAT_SLUG_REVERSE filters it out.
              cats_main: primaryCategoryFor(b.visible_categories) || CAT_FALLBACK_KEY,
              age_groups: JSON.stringify(Array.isArray(b.age_groups) ? b.age_groups : []),
              has_photo: !!(b.logo || galleryFirst),
              is_online: !!b.is_online,
              sop: !!b.sop,
              phone: b.phone || '',
              email: b.email || '',
              website: b.website || '',
              facebook: b.facebook || '',
              instagram: b.instagram || '',
              description: b.description || '',
              audit_score: b.audit_score != null ? Number(b.audit_score) : null,
            },
          };
        });

      // Sofia has ~1338 published rows which slows initial render in the lab.
      // Spatially down-sample to ~1/3 (8×8 grid → 64 cells, keeping ⌈n/3⌉
      // pins per cell) so the demo feels snappy while preserving an even
      // visual distribution across the city. Other cities pass through
      // unmodified — they're already small enough.
      if (cityBg === 'София' && features.length > 500) {
        return spatialSample(features, 8, 1 / 3);
      }
      return features;
    }

    let activePopup = null;
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function flyOrJump(opts) {
      if (reduceMotion) map.jumpTo(opts);
      else map.easeTo(opts);
    }

    let layersAttached = false;
    let iconsLoaded = false;
    // Cache the in-flight icon-loading Promise so concurrent callers (initial
    // attachLayers + a possible styleimagemissing re-trigger) all wait on the
    // same async chain instead of racing one another.
    let iconsLoadingPromise = null;

    // Load each category SVG into the Mapbox sprite as a white-tinted image
    // so the `pin-icons` symbol layer can reference it by name. Uses an
    // off-screen Canvas to rasterise the SVG to a deterministic 48×48 RGBA
    // bitmap — passing the SVG via `<img>` directly to Mapbox's `addImage`
    // is unreliable because some browsers honour the SVG's viewBox over the
    // explicit width/height attributes, producing mismatched bitmap sizes.
    // Returns a Promise that resolves once every CAT_ICON entry has either
    // been registered as a Mapbox image or failed (and we have moved on).
    // The caller in attachLayers() awaits this BEFORE adding the symbol
    // layers that reference `cat-${slug}` images, which is the documented
    // workaround for mapbox/mapbox-gl-js#6231 — adding a symbol layer
    // before its icon-image is registered makes the tile worker cache a
    // "missing image" verdict that triggerRepaint cannot invalidate, so
    // glyphs never appear at initial zoom.
    function loadCategoryIcons() {
      if (iconsLoaded) return Promise.resolve();
      if (iconsLoadingPromise) return iconsLoadingPromise;

      iconsLoadingPromise = new Promise((resolve) => {
        const entries = Object.entries(CAT_ICON);
        if (entries.length === 0) {
          // Edge case — no categories to load. Mark as "loaded" so the
          // fast-path short-circuit at the top of loadCategoryIcons is
          // reachable on subsequent calls.
          iconsLoaded = true;
          resolve();
          return;
        }
        let pending = entries.length;
        let successCount = 0;

        const settle = () => {
          if (--pending !== 0) return;
          iconsLoaded = successCount > 0;
          // triggerRepaint is no longer load-bearing for initial render
          // (caller awaits this Promise before adding the symbol layer),
          // but kept defensively for the styleimagemissing re-trigger
          // path where the symbol layer is already live.
          if (successCount > 0) {
            try { map.triggerRepaint(); } catch (_) { /* ignore */ }
          }
          resolve();
        };

        entries.forEach(([cat, svg]) => {
          const slug = CAT_SLUG[cat];
          if (!slug) { settle(); return; }
          if (map.hasImage(`cat-${slug}`)) {
            // Already registered (e.g. survived a style hot-reload).
            successCount++;
            settle();
            return;
          }

          // Force explicit pixel size on the root <svg> so even browsers that
          // honour the viewBox over <img width/height> rasterise to 48×48.
          const whiteSvg = svg
            .replace(/stroke="currentColor"/g, 'stroke="#ffffff"')
            .replace(/fill="currentColor"/g, 'fill="#ffffff"')
            .replace(/<svg\s/, '<svg width="48" height="48" ');
          const blob = new Blob([whiteSvg], { type: 'image/svg+xml' });
          const url = URL.createObjectURL(blob);
          const img = new Image();
          img.width = 48;
          img.height = 48;

          // Defensive timeout — converts a possible permanent hang (img neither
          // fires onload nor onerror, e.g. aborted page navigation) into a
          // degraded render where the styleimagemissing handler can recover.
          // Without this, `await iconsReady` in attachLayers could block the
          // entire map indefinitely on a single image-thread misbehaviour.
          let settled = false;
          const settleOnce = () => { if (settled) return; settled = true; settle(); };
          const timeoutId = setTimeout(() => {
            console.warn('[map] icon load timed out for', slug);
            URL.revokeObjectURL(url);
            settleOnce();
          }, 3000);

          img.onload = () => {
            clearTimeout(timeoutId);
            try {
              // Off-screen canvas → guaranteed 48×48 RGBA buffer regardless of
              // how the browser interpreted the SVG's intrinsic dimensions.
              const canvas = document.createElement('canvas');
              canvas.width = 48;
              canvas.height = 48;
              const ctx = canvas.getContext('2d');
              ctx.clearRect(0, 0, 48, 48);
              ctx.drawImage(img, 0, 0, 48, 48);
              // pixelRatio: 2 — this 48×48 bitmap is the @2x retina source,
              // so Mapbox treats its base size as 24 CSS px.
              // sdf: true — Mapbox treats the alpha channel as a mask so the
              // pin-icons-* layers can recolour the glyph at runtime via the
              // `icon-color` paint property (white on paid pins, dark muted
              // lilac on Стандартен pins for the demoted-but-readable look).
              // NOTE: this canvas produces a binary alpha mask with a ~1 px AA
              // gradient at stroke edges, NOT a true distance-field encoding.
              // Renders cleanly at our 10–20 CSS px range; if these icons are
              // ever scaled past ~32 px, regenerate from a real SDF tool to
              // avoid stair-stepping at the edges.
              map.addImage(`cat-${slug}`, canvas, { pixelRatio: 2, sdf: true });
              successCount++;
            } catch (e) {
              console.warn('[map] icon rasterise/add failed for', slug, e);
            }
            URL.revokeObjectURL(url);
            settleOnce();
          };
          img.onerror = () => {
            clearTimeout(timeoutId);
            console.warn('[map] icon load failed for', slug);
            URL.revokeObjectURL(url);
            settleOnce();
          };
          img.src = url;
        });
      });

      return iconsLoadingPromise;
    }

    async function attachLayers() {
      if (layersAttached) return;
      layersAttached = true;
      // Kick off icon-loading immediately so it runs in parallel with the
      // synchronous addSource/addLayer calls below. We `await` it only at
      // the boundary where pin-icons-* are attached so the symbol layer
      // never sees a missing-image state. Race condition fix per
      // mapbox/mapbox-gl-js#6231.
      const iconsReady = loadCategoryIcons();

      // Register the safety-net listener BEFORE the symbol layers attach so
      // there is no window where pin-icons-* could request a missing image
      // and have no recovery path. If Mapbox ever asks for a `cat-${slug}`
      // image we don't have (e.g. after a future setStyle hot-reload that
      // wipes the sprite), reset state and re-run loadCategoryIcons.
      map.on('styleimagemissing', (e) => {
        if (!e || typeof e.id !== 'string' || !e.id.startsWith('cat-')) return;
        iconsLoaded = false;
        iconsLoadingPromise = null;
        loadCategoryIcons();
      });

      // "Близо до мен" overlay — empty until the user grants location.
      // Two layers: a soft purple disc + dashed outline for the radius, and
      // a small solid dot at the user's exact position.
      map.addSource('near-radius', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
      });
      map.addSource('near-user', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
      });
      map.addLayer({
        id: 'near-radius-fill', type: 'fill', source: 'near-radius',
        paint: { 'fill-color': '#7c4dff', 'fill-opacity': 0.06 },
      });
      map.addLayer({
        id: 'near-radius-line', type: 'line', source: 'near-radius',
        paint: {
          'line-color': '#7c4dff',
          'line-width': 2,
          'line-opacity': 0.55,
          'line-dasharray': [3, 2],
        },
      });
      map.addLayer({
        id: 'near-user-halo', type: 'circle', source: 'near-user',
        paint: {
          'circle-radius': 18,
          'circle-color': '#7c4dff',
          'circle-opacity': 0.18,
          'circle-stroke-width': 0,
        },
      });
      map.addLayer({
        id: 'near-user-dot', type: 'circle', source: 'near-user',
        paint: {
          'circle-radius': 7,
          'circle-color': '#7c4dff',
          'circle-stroke-color': '#ffffff',
          'circle-stroke-width': 3,
        },
      });

      // City boundary source — empty until selectCity() lazy-loads the
      // current city's GeoJSON. Added FIRST so the fill/line layers render
      // beneath the pin layers we add below.
      map.addSource('boundary', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
      });
      map.addLayer({
        id: 'boundary-fill', type: 'fill', source: 'boundary',
        paint: {
          'fill-color': '#7c4dff',
          'fill-opacity': 0.07,
        },
      });
      map.addLayer({
        id: 'boundary-line', type: 'line', source: 'boundary',
        paint: {
          'line-color': '#5a2ecf',
          'line-width': [
            'interpolate', ['linear'], ['zoom'],
            10, 1.5,
            13, 2.5,
            16, 3.5,
          ],
          'line-opacity': 0.75,
          'line-dasharray': [4, 2],
        },
      });

      map.addSource('businesses', {
        type: 'geojson',
        data: { type: 'FeatureCollection', features: [] },
        cluster: true,
        // Clusters only form at zoom ≤ 11. At default city zoom 12 every
        // point renders individually so the category icons (which only paint
        // on unclustered pins) are visible from first paint.
        clusterMaxZoom: 11,
        clusterRadius: 48,
      });

      map.addLayer({
        id: 'clusters', type: 'circle', source: 'businesses',
        filter: ['has', 'point_count'],
        paint: {
          'circle-color': PIN_COLOR,
          'circle-opacity': 0.92,
          'circle-stroke-color': '#ffffff',
          'circle-stroke-width': 3,
          'circle-radius': ['step', ['get', 'point_count'], 18, 10, 22, 30, 28, 80, 34],
        },
      });
      map.addLayer({
        id: 'cluster-count', type: 'symbol', source: 'businesses',
        filter: ['has', 'point_count'],
        layout: {
          'text-field': ['get', 'point_count_abbreviated'],
          'text-font': ['DIN Pro Medium', 'Arial Unicode MS Bold'],
          'text-size': 13,
        },
        paint: { 'text-color': '#ffffff' },
      });

      // Single tier-aware pin layer — colour, stroke and radius all driven by
      // the row's `tier` value via Mapbox `match` expressions. Tier palette
      // mirrors search.html (see CSS vars in :root).
      // Visual hierarchy: Премиум gold > Доверен purple > Проверен green
      //                   > Стандартен light lilac-grey.
      // (Безплатен palette retained below for legend parity but never renders
      // as a pin — those rows are filtered out at loadBusinessesFor.)
      // Paid tiers are saturated so the white category icon overlaid by the
      // `pin-icons-paid` layer pops. Стандартен is intentionally low-contrast
      // (light lilac disc + dark glyph via `pin-icons-standard.icon-color`)
      // so the pin reads as demoted, nudging owners toward upgrading.
      const TIER_COLOR = [
        'match', ['get', 'tier'],
        'Премиум',    '#d4af37',  // gold
        'Доверен',    '#7c4dff',  // purple
        'Проверен',   '#2e994d',  // green
        'Стандартен', '#c8c2d4',  // light muted lilac-grey — intentionally low contrast to push upgrade
        'Безплатен',  '#9b94b8',  // muted grey-purple (was outlined white)
        '#9b94b8',
      ];
      // White ring on every tier so pins pop off the basemap and the icon
      // inside has a small breathing margin.
      const TIER_STROKE = [
        'match', ['get', 'tier'],
        'Премиум',    '#ffffff',
        'Доверен',    '#ffffff',
        'Проверен',   '#ffffff',
        'Стандартен', '#ffffff',
        'Безплатен',  '#ffffff',
        '#ffffff',
      ];
      // Per-tier base radius scales with zoom. Bumped from the icon-less
      // sizes so the white category icon (rendered ~12-14px wide by the
      // pin-icons symbol layer) has room to read inside the pin.
      const TIER_RADIUS = [
        'interpolate', ['linear'], ['zoom'],
        11, [
          'match', ['get', 'tier'],
          'Премиум',    11,
          'Доверен',    10,
          'Проверен',   9,
          'Стандартен', 8,
          'Безплатен',  7,
          7,
        ],
        14, [
          'match', ['get', 'tier'],
          'Премиум',    16,
          'Доверен',    15,
          'Проверен',   14,
          'Стандартен', 12,
          'Безплатен',  11,
          11,
        ],
        16, [
          'match', ['get', 'tier'],
          'Премиум',    20,
          'Доверен',    19,
          'Проверен',   18,
          'Стандартен', 16,
          'Безплатен',  14,
          14,
        ],
      ];
      // Two pin layers, identical paint, different visibility gates:
      //   pins-paid:     Премиум/Доверен/Проверен — always visible
      //   pins-standard: Стандартен — minzoom 13 (only on close zoom)
      // Безплатен never reaches the map (filtered at data load).
      map.addLayer({
        id: 'pins-paid', type: 'circle', source: 'businesses',
        filter: ['all',
          ['!', ['has', 'point_count']],
          ['in', ['get', 'tier'], ['literal', ['Премиум', 'Доверен', 'Проверен']]],
        ],
        paint: {
          'circle-color': TIER_COLOR,
          'circle-stroke-color': TIER_STROKE,
          'circle-stroke-width': 2,
          'circle-radius': TIER_RADIUS,
        },
      });
      map.addLayer({
        id: 'pins-standard', type: 'circle', source: 'businesses',
        filter: ['all',
          ['!', ['has', 'point_count']],
          ['==', ['get', 'tier'], 'Стандартен'],
        ],
        minzoom: 13,
        paint: {
          'circle-color': TIER_COLOR,
          'circle-stroke-color': TIER_STROKE,
          'circle-stroke-width': 2,
          'circle-radius': TIER_RADIUS,
        },
      });

      // Category-icon layer — white SVGs added to the Mapbox sprite at runtime
      // by `loadCategoryIcons()`. Sits ON TOP of the circle pins so the icon
      // reads as the pin's foreground glyph. `icon-allow-overlap` keeps icons
      // visible even on dense clusters of pins. minzoom: 12 hides icons when
      // pins are too small (~7-9px radius) for a glyph to be legible.
      // Category-icon symbol layer — split same way as the circle pins so
      // Стандартен icons inherit the minzoom 13 gate.
      const ICON_IMAGE_EXPR = [
        'match', ['get', 'cats_main'],
        'Специалисти',           'cat-specialisti',
        'Учене и умения',        'cat-uchene',
        'Игри и забавления',     'cat-igri',
        'Култура',               'cat-kultura',
        'Спорт и движение',      'cat-sport',
        'Тържества и събития',   'cat-turzhestva',
        'Стоки',                 'cat-stoki',
        'Домашна грижа и помощ', 'cat-gridja',
        CAT_FALLBACK_KEY,        'cat-fallback',
        // Default arm — used if a row somehow has a value outside the set
        // above. Points at the fallback bitmap so we never end up with an
        // unrendered "Image '' is not loaded" warning from Mapbox.
        'cat-fallback',
      ];
      const ICON_SIZE_EXPR = [
        'interpolate', ['linear'], ['zoom'],
        12, 0.45,
        14, 0.65,
        16, 0.85,
      ];

      // Gate the pin-icons-* symbol layers on the icon-loading Promise. By
      // now the rasterise→addImage chain has had ~one event loop to settle
      // in parallel with the addSource/addLayer calls above; this await
      // typically resolves immediately. The point is to GUARANTEE that no
      // tile-worker call ever resolves icon-image against a sprite that
      // hasn't yet registered the cat-${slug} bitmaps.
      await iconsReady;

      map.addLayer({
        id: 'pin-icons-paid', type: 'symbol', source: 'businesses',
        filter: ['all',
          ['!', ['has', 'point_count']],
          ['in', ['get', 'tier'], ['literal', ['Премиум', 'Доверен', 'Проверен']]],
        ],
        minzoom: 12,
        layout: {
          'icon-image': ICON_IMAGE_EXPR,
          'icon-size': ICON_SIZE_EXPR,
          'icon-allow-overlap': true,
          'icon-ignore-placement': true,
        },
        // Paint white on the saturated paid-tier discs (gold / purple / green).
        // Possible only because the icons are registered with sdf: true.
        paint: { 'icon-color': '#ffffff' },
      });
      map.addLayer({
        id: 'pin-icons-standard', type: 'symbol', source: 'businesses',
        filter: ['all',
          ['!', ['has', 'point_count']],
          ['==', ['get', 'tier'], 'Стандартен'],
        ],
        minzoom: 13,
        layout: {
          'icon-image': ICON_IMAGE_EXPR,
          'icon-size': ICON_SIZE_EXPR,
          'icon-allow-overlap': true,
          'icon-ignore-placement': true,
        },
        // Dark muted lilac on the demoted Стандартен disc — keeps category
        // recognisable (~5:1 contrast on #c8c2d4) while the disc itself is
        // visually demoted vs the saturated paid tiers.
        paint: { 'icon-color': '#4a4458' },
      });

      // Click cluster → zoom in
      map.on('click', 'clusters', (e) => {
        const features = map.queryRenderedFeatures(e.point, { layers: ['clusters'] });
        if (!features.length) return;
        const clusterId = features[0].properties.cluster_id;
        map.getSource('businesses').getClusterExpansionZoom(clusterId, (err, zoom) => {
          if (err) return;
          flyOrJump({ center: features[0].geometry.coordinates, zoom });
        });
      });

      // Click pin → popup
      ['pins-paid', 'pins-standard'].forEach(layer => {
        map.on('click', layer, (e) => {
          const f = e.features[0];
          const coords = f.geometry.coordinates.slice();
          if (activePopup) activePopup.remove();
          const popup = new mapboxgl.Popup({ offset: 14, closeButton: true, maxWidth: 'none' })
            .setLngLat(coords)
            .setHTML(buildPopupHTML(f.properties))
            .addTo(map);
          activePopup = popup;

          // Inject hero image safely (CSS-injection-proof)
          const hero = pickHero(f.properties);
          if (hero) {
            const img = popup.getElement().querySelector('[data-pop-img]');
            if (img) img.style.backgroundImage = `url(${JSON.stringify(hero)})`;
          }
          popup.on('close', () => { if (activePopup === popup) activePopup = null; });
        });
        map.on('mouseenter', layer, () => map.getCanvas().style.cursor = 'pointer');
        map.on('mouseleave', layer, () => map.getCanvas().style.cursor = '');
      });
      map.on('mouseenter', 'clusters', () => map.getCanvas().style.cursor = 'pointer');
      map.on('mouseleave', 'clusters', () => map.getCanvas().style.cursor = '');
    }

    function setSourceData(features) {
      const src = map.getSource('businesses');
      if (src) src.setData({ type: 'FeatureCollection', features });
    }

    // ───── City boundary overlay ─────
    // Lazy-loaded GeoJSON polygons from public_html/data/city-boundaries/.
    // Cached per session so re-selecting a city does not re-fetch.
    const boundaryCache = new Map();
    const EMPTY_FC = { type: 'FeatureCollection', features: [] };

    async function setBoundaryFor(slug) {
      const src = map.getSource('boundary');
      if (!src) return;
      // Cache hit — go straight to the cached polygon (or do nothing if a
      // previous fetch failed). Skip the optimistic clear to avoid two
      // setData calls in a single frame.
      if (boundaryCache.has(slug)) {
        const cached = boundaryCache.get(slug);
        src.setData(cached || EMPTY_FC);
        return;
      }
      // Cold path — clear the previous city's outline immediately so the
      // user does not stare at a stale boundary while we fetch the new one.
      src.setData(EMPTY_FC);
      try {
        // Append a version stamp so a future GeoJSON refresh isn't served
        // from `force-cache` indefinitely. Bump on deploy when polygons change.
        const resp = await fetch(`data/city-boundaries/${encodeURIComponent(slug)}.geojson?v=1`, {
          cache: 'force-cache',
        });
        if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
        const fc = await resp.json();
        boundaryCache.set(slug, fc);
        // Only apply if the user is still on this city — avoids the same
        // race the pin-loader guards against via currentLoadToken.
        if (currentSlug === slug) src.setData(fc);
      } catch (e) {
        console.warn(`[map] boundary fetch failed for ${slug}`, e);
        // Cache the failure so we do not retry on every selectCity().
        boundaryCache.set(slug, null);
      }
    }

    // ───── UI: city tabs + chrome ─────

    function buildCityTabs() {
      const wrap = document.getElementById('city-tabs');
      const html = Object.entries(CITIES).map(([slug, c]) => {
        const selected = slug === currentSlug ? 'true' : 'false';
        return `<button type="button" class="city-tab" role="tab" data-slug="${slug}" aria-selected="${selected}" tabindex="${selected === 'true' ? '0' : '-1'}">${escapeHtml(c.bg)}</button>`;
      }).join('');
      wrap.innerHTML = html;

      wrap.addEventListener('click', (e) => {
        const btn = e.target.closest('.city-tab');
        if (!btn) return;
        const slug = btn.dataset.slug;
        if (slug && slug !== currentSlug) selectCity(slug, { pushHistory: true });
      });

      // ARIA tablist with manual activation: arrow keys move focus + tabindex
      // only — Enter/Space (or click) commits the selection. Avoids firing a
      // Supabase fetch on every arrow press while the user is browsing tabs.
      wrap.addEventListener('keydown', (e) => {
        const isMotion = e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'Home' || e.key === 'End';
        if (!isMotion) return;
        const tabs = Array.from(wrap.querySelectorAll('.city-tab'));
        const focusedIdx = tabs.findIndex(t => t === document.activeElement);
        const startIdx = focusedIdx >= 0 ? focusedIdx : tabs.findIndex(t => t.dataset.slug === currentSlug);
        let nextIdx = startIdx;
        if (e.key === 'ArrowLeft')  nextIdx = (startIdx - 1 + tabs.length) % tabs.length;
        if (e.key === 'ArrowRight') nextIdx = (startIdx + 1) % tabs.length;
        if (e.key === 'Home') nextIdx = 0;
        if (e.key === 'End')  nextIdx = tabs.length - 1;
        e.preventDefault();
        // Roving tabindex: only the focused tab is in the tab order.
        tabs.forEach((t, i) => t.setAttribute('tabindex', i === nextIdx ? '0' : '-1'));
        tabs[nextIdx].focus();
      });
    }

    function updateTabsUi() {
      document.querySelectorAll('.city-tab').forEach(t => {
        const isActive = t.dataset.slug === currentSlug;
        t.setAttribute('aria-selected', isActive ? 'true' : 'false');
        t.setAttribute('tabindex', isActive ? '0' : '-1');
        if (isActive) t.scrollIntoView({ behavior: reduceMotion ? 'auto' : 'smooth', inline: 'center', block: 'nearest' });
      });
    }

    function updateCityPill() {
      const el = document.querySelector('[data-current-city]');
      if (el) el.textContent = CITIES[currentSlug].bg;
    }

    function showEmptyState() {
      const city = CITIES[currentSlug];
      document.getElementById('empty-title').textContent = `Скоро добавяме ${city.bg}`;
      document.getElementById('empty-text').textContent =
        `Работим по проверени бизнеси за ${city.bg}. Засега виж София и Стара Загора.`;
      document.getElementById('empty-cta').href = `search.html?city=${encodeURIComponent(currentSlug)}`;
      document.getElementById('empty-state').hidden = false;
      document.getElementById('legend').hidden = true;
      document.getElementById('stat').hidden = true;
    }

    function hideEmptyState() {
      document.getElementById('empty-state').hidden = true;
      document.getElementById('legend').hidden = false;
    }

    function updateStat(count) {
      const stat = document.getElementById('stat');
      if (count > 0) {
        stat.innerHTML = `<strong>${count}</strong> места на картата`;
        stat.hidden = false;
      } else {
        stat.hidden = true;
      }
    }

    // ───── City switching ─────

    // Notify the parent window (when this page is embedded in an iframe) that
    // the user changed cities, so the wrapper page can sync its own URL bar.
    // Guarded so direct visits to this page (no parent) don't crash.
    function notifyParentCityChange(slug) {
      try {
        if (window.parent && window.parent !== window) {
          // Target same-origin only. Prevents the slug leaking if a hostile
          // third-party site ever embeds map-embed.html as an iframe.
          window.parent.postMessage({ type: 'zd:map:cityChange', slug }, location.origin);
        }
      } catch (_) { /* cross-origin parent — ignore */ }
    }

    // ═══ Filters ═════════════════════════════════════════════════════════════
    // Single source of truth for what's narrowing the map. Mutations always go
    // through `setFilter()` (or `clearFilters()`), which re-applies + URL-syncs
    // + notifies the parent wrapper. The per-city raw dataset is cached so we
    // never re-query Supabase when only a filter changes.

    // 33 подкатегории → 8 главни. Validated by user 2026-05-03.
    // Rows whose `visible_categories[]` includes one of the 8 главни directly
    // are also matched (some rows are tagged with the umbrella label).
    const CATEGORY_ROLLUP = {
      'Специалисти':           ['Логопед', 'Детски психолог', 'Детски център'],
      'Учене и умения':        ['Частни уроци', 'Чужди езици', 'Математика', 'Български език', 'Занимални'],
      'Игри и забавления':     ['Играчки', 'Куклен театър'],
      'Култура':               ['Музикални', 'Пеене', 'Балет', 'Музеи'],
      'Спорт и движение':      ['Бойни изкуства', 'Футбол', 'Баскетбол', 'Танци', 'Хокей', 'Борба', 'Езда', 'Ски', 'Кънки на лед', 'Тенис'],
      'Тържества и събития':   ['Украса', 'Торти'],
      'Стоки':                 ['Детски обувки', 'Детски дрехи', 'Детска кухня', 'Детски храни'],
      'Домашна грижа и помощ': ['Частна детска градина', 'Частна ясла'],
    };
    // URL slugs for the 8 главни — keeps the URL ASCII-clean and short.
    // CAT_FALLBACK_KEY also gets a slug so loadCategoryIcons() can register its
    // bitmap as 'cat-fallback' alongside the 8 main category bitmaps.
    const CAT_SLUG = {
      'Специалисти':           'specialisti',
      'Учене и умения':        'uchene',
      'Игри и забавления':     'igri',
      'Култура':               'kultura',
      'Спорт и движение':      'sport',
      'Тържества и събития':   'turzhestva',
      'Стоки':                 'stoki',
      'Домашна грижа и помощ': 'gridja',
      [CAT_FALLBACK_KEY]:      'fallback',
    };
    // Reverse map for URL-slug → main-category lookup. The fallback sentinel
    // is an internal-only key, so we exclude it: nobody should ever land on
    // ?cat=fallback as a user-facing filter.
    const CAT_SLUG_REVERSE = Object.fromEntries(
      Object.entries(CAT_SLUG)
        .filter(([bg]) => bg !== CAT_FALLBACK_KEY)
        .map(([bg, slug]) => [slug, bg])
    );
    const TIERS_ORDER = ['Премиум', 'Доверен', 'Проверен', 'Стандартен', 'Безплатен'];

    const FILTERS = {
      q: '',
      cats: new Set(),
      subcats: new Set(),
      ageFrom: null,
      ageTo: null,
      tiers: new Set(),
      photo: false,
      sop: false,
      online: false,
      top: false,  // Top picks: high-rating + spatial-distribution mode
    };
    // Single source of truth for the boolean toggles — used by URL parse,
    // URL serialise, sync UI, and the change handlers.
    const TOGGLE_KEYS = ['photo', 'sop', 'online', 'top'];
    const TOP_PICKS_MIN_RATING = 4.5;
    const TOP_PICKS_GRID = 6;        // 6×6 spatial cells across the city bbox
    const TOP_PICKS_PER_CELL = 2;    // best 2 in each cell

    // ── "Близо до мен" — geolocation-driven radius filter ────────────────────
    const NEAR_RADIUS_KM = 2;
    const nearMe = {
      active: false,
      lat: null,
      lng: null,
      pendingPrompt: false,  // true while the geolocation prompt is open
    };

    // Haversine — great-circle distance in km between two lat/lng points.
    function haversineKm(lat1, lng1, lat2, lng2) {
      const R = 6371;
      const toRad = d => d * Math.PI / 180;
      const dLat = toRad(lat2 - lat1);
      const dLng = toRad(lng2 - lng1);
      const a = Math.sin(dLat / 2) ** 2 +
                Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) *
                Math.sin(dLng / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(a));
    }

    // Generate a 64-vertex polygon approximating a circle of `radiusKm`
    // around (centerLng, centerLat). Used to draw the radius overlay.
    function circlePolygon(centerLng, centerLat, radiusKm, points = 64) {
      const coords = [];
      const distRad = radiusKm / 6371;
      const latRad = centerLat * Math.PI / 180;
      const lngRad = centerLng * Math.PI / 180;
      for (let i = 0; i <= points; i++) {
        const bearing = (i / points) * 2 * Math.PI;
        const lat2 = Math.asin(
          Math.sin(latRad) * Math.cos(distRad) +
          Math.cos(latRad) * Math.sin(distRad) * Math.cos(bearing)
        );
        const lng2 = lngRad + Math.atan2(
          Math.sin(bearing) * Math.sin(distRad) * Math.cos(latRad),
          Math.cos(distRad) - Math.sin(latRad) * Math.sin(lat2)
        );
        coords.push([lng2 * 180 / Math.PI, lat2 * 180 / Math.PI]);
      }
      return {
        type: 'FeatureCollection',
        features: [{ type: 'Feature', geometry: { type: 'Polygon', coordinates: [coords] } }],
      };
    }

    function showToast(msg, durationMs = 3500) {
      const el = document.getElementById('toast');
      if (!el) return;
      el.textContent = msg;
      el.hidden = false;
      // Force reflow so the transition fires when we add the class.
      void el.offsetWidth;
      el.classList.add('is-show');
      clearTimeout(showToast._t);
      showToast._t = setTimeout(() => {
        el.classList.remove('is-show');
        setTimeout(() => { el.hidden = true; }, 220);
      }, durationMs);
    }
    // Allowlist for ?sub= URL hydration so adversarial values don't enter
    // FILTERS.subcats. Built lazily after CATEGORY_ROLLUP is declared.
    const ALL_SUBS = new Set(Object.values(CATEGORY_ROLLUP).flat());

    // Per-city raw features cache. Keyed by city slug. Filled by
    // `loadBusinessesFor` (called from selectCity / initial load) and read by
    // `applyFilters` so a filter change doesn't re-query Supabase.
    const cityFeatureCache = new Map();
    let currentRawFeatures = [];

    function activeFilterCount() {
      let n = 0;
      if (FILTERS.q) n++;
      n += FILTERS.cats.size;
      n += FILTERS.subcats.size;
      // Age counts as a single "Възраст" filter regardless of which bound(s)
      // the user set — matches what the pill row shows.
      if (FILTERS.ageFrom != null || FILTERS.ageTo != null) n++;
      n += FILTERS.tiers.size;
      if (FILTERS.photo) n++;
      if (FILTERS.sop) n++;
      if (FILTERS.online) n++;
      if (FILTERS.top) n++;
      // Note: near-me is reflected as its own active pill but not counted
      // here — it's a major mode separate from the in-panel toggles.
      return n;
    }

    function featureMatches(f) {
      const p = f.properties;

      // Free-text search — name OR any tag in visible_categories[].
      if (FILTERS.q) {
        const needle = FILTERS.q.toLowerCase();
        const haystack = (p.name || '').toLowerCase();
        let cats = [];
        try {
          cats = typeof p.cats_raw === 'string' ? JSON.parse(p.cats_raw) : (p.cats_raw || []);
        } catch (_) { cats = []; }
        const catHit = cats.some(c => String(c).toLowerCase().includes(needle));
        if (!haystack.includes(needle) && !catHit) return false;
      }

      // Категории — match if ANY of the row's tags is in the rollup of any
      // selected главна, OR if the row is tagged directly with that главна.
      if (FILTERS.cats.size) {
        let cats = [];
        try {
          cats = typeof p.cats_raw === 'string' ? JSON.parse(p.cats_raw) : (p.cats_raw || []);
        } catch (_) { cats = []; }
        const catSet = new Set(cats);
        let ok = false;
        for (const main of FILTERS.cats) {
          if (catSet.has(main)) { ok = true; break; }
          const subs = CATEGORY_ROLLUP[main] || [];
          if (subs.some(s => catSet.has(s))) { ok = true; break; }
        }
        if (!ok) return false;
      }

      // Подкатегории — strict match against any selected.
      if (FILTERS.subcats.size) {
        let cats = [];
        try {
          cats = typeof p.cats_raw === 'string' ? JSON.parse(p.cats_raw) : (p.cats_raw || []);
        } catch (_) { cats = []; }
        const catSet = new Set(cats);
        let ok = false;
        for (const sub of FILTERS.subcats) {
          if (catSet.has(sub)) { ok = true; break; }
        }
        if (!ok) return false;
      }

      // Възраст — row must overlap the requested range. age_groups is an
      // array of e.g. ['0-3','3-7','7-12','12-18'] or numeric strings.
      // Rows without age_groups data are INCLUDED — most current rows lack
      // this column, so excluding them would silently kill the result set.
      // When the underlying data is enriched we can flip to strict mode.
      if (FILTERS.ageFrom != null || FILTERS.ageTo != null) {
        let groups = [];
        try {
          groups = typeof p.age_groups === 'string' ? JSON.parse(p.age_groups) : (p.age_groups || []);
        } catch (_) { groups = []; }
        if (groups.length) {
          const wantFrom = FILTERS.ageFrom != null ? FILTERS.ageFrom : 0;
          const wantTo = FILTERS.ageTo != null ? FILTERS.ageTo : 99;
          const overlaps = groups.some(g => {
            const m = String(g).match(/(\d+)\s*[-–]\s*(\d+)/);
            if (!m) {
              const n = Number(g);
              return Number.isFinite(n) && n >= wantFrom && n <= wantTo;
            }
            const lo = Number(m[1]), hi = Number(m[2]);
            return hi >= wantFrom && lo <= wantTo;
          });
          if (!overlaps) return false;
        }
      }

      // Tier — multi-select; row must match one of the selected tiers.
      if (FILTERS.tiers.size && !FILTERS.tiers.has(p.tier)) return false;

      // Toggles
      if (FILTERS.photo && !p.has_photo) return false;
      if (FILTERS.sop && !p.sop) return false;
      if (FILTERS.online && !p.is_online) return false;

      // "Близо до мен" — radius gate. Combined with other filters (e.g.
      // category + tier within the radius). Only fires when the user has
      // granted location.
      if (nearMe.active && nearMe.lat != null && nearMe.lng != null) {
        const [lng, lat] = f.geometry.coordinates;
        if (haversineKm(nearMe.lat, nearMe.lng, lat, lng) > NEAR_RADIUS_KM) {
          return false;
        }
      }

      return true;
    }

    // Top-picks distribution: keep only highly-rated rows, then thin the set
    // by bucketing into a NxN grid over the bbox and taking the top
    // PER_CELL by rating from each non-empty cell. Result is a curated,
    // spatially-spread sample suitable for "highlights" mode.
    function applyTopPicks(features) {
      const rated = features.filter(f =>
        Number(f.properties.google_rating) >= TOP_PICKS_MIN_RATING
      );
      if (rated.length <= TOP_PICKS_PER_CELL) return rated;

      let minLng = Infinity, maxLng = -Infinity;
      let minLat = Infinity, maxLat = -Infinity;
      for (const f of rated) {
        const [lng, lat] = f.geometry.coordinates;
        if (lng < minLng) minLng = lng;
        if (lng > maxLng) maxLng = lng;
        if (lat < minLat) minLat = lat;
        if (lat > maxLat) maxLat = lat;
      }
      const cellW = (maxLng - minLng) / TOP_PICKS_GRID;
      const cellH = (maxLat - minLat) / TOP_PICKS_GRID;
      // Degenerate bbox (all rows at one point) → just return top by rating.
      if (cellW === 0 || cellH === 0) {
        return rated
          .slice()
          .sort((a, b) => Number(b.properties.google_rating) - Number(a.properties.google_rating))
          .slice(0, TOP_PICKS_PER_CELL * TOP_PICKS_GRID);
      }

      const buckets = new Map();
      for (const f of rated) {
        const [lng, lat] = f.geometry.coordinates;
        const cx = Math.min(TOP_PICKS_GRID - 1, Math.floor((lng - minLng) / cellW));
        const cy = Math.min(TOP_PICKS_GRID - 1, Math.floor((lat - minLat) / cellH));
        const key = cx + ',' + cy;
        if (!buckets.has(key)) buckets.set(key, []);
        buckets.get(key).push(f);
      }

      const out = [];
      for (const list of buckets.values()) {
        // Sort by rating desc, then by review_count desc as tiebreaker — a
        // 5.0(2-review) loses to a 4.8(120-review) when ratings are close.
        list.sort((a, b) => {
          const dr = Number(b.properties.google_rating) - Number(a.properties.google_rating);
          if (dr !== 0) return dr;
          return (Number(b.properties.google_review_count) || 0)
               - (Number(a.properties.google_review_count) || 0);
        });
        out.push(...list.slice(0, TOP_PICKS_PER_CELL));
      }
      return out;
    }

    function applyFilters() {
      let filtered = currentRawFeatures.filter(featureMatches);
      if (FILTERS.top) filtered = applyTopPicks(filtered);
      if (layersAttached) setSourceData(filtered);
      updateStat(filtered.length);
      updateActiveFiltersUi();
      const triggerCount = document.getElementById('filter-trigger-count');
      const n = activeFilterCount();
      if (triggerCount) {
        triggerCount.textContent = String(n);
        triggerCount.hidden = n === 0;
      }
    }

    function clearFilters({ syncUrl = true } = {}) {
      FILTERS.q = '';
      FILTERS.cats.clear();
      FILTERS.subcats.clear();
      FILTERS.ageFrom = null;
      FILTERS.ageTo = null;
      FILTERS.tiers.clear();
      TOGGLE_KEYS.forEach(k => { FILTERS[k] = false; });
      // Also turn off near-me when clearing — it's a major mode that should
      // not silently persist.
      if (nearMe.active) deactivateNearMe();
      syncFilterPanelInputs();
      applyFilters();
      if (syncUrl) syncUrlFromFilters();
    }

    // ── Near-me lifecycle ───────────────────────────────────────────────────

    function _setNearTriggerState({ active = false, loading = false } = {}) {
      const btn = document.getElementById('near-trigger');
      if (!btn) return;
      btn.classList.toggle('is-active', active);
      btn.classList.toggle('is-loading', loading);
      btn.setAttribute('aria-pressed', active ? 'true' : 'false');
    }

    function _drawNearOverlay() {
      const radSrc = map.getSource('near-radius');
      const userSrc = map.getSource('near-user');
      if (!radSrc || !userSrc) return;
      if (nearMe.active && nearMe.lat != null && nearMe.lng != null) {
        radSrc.setData(circlePolygon(nearMe.lng, nearMe.lat, NEAR_RADIUS_KM));
        userSrc.setData({
          type: 'FeatureCollection',
          features: [{
            type: 'Feature',
            geometry: { type: 'Point', coordinates: [nearMe.lng, nearMe.lat] },
          }],
        });
      } else {
        const empty = { type: 'FeatureCollection', features: [] };
        radSrc.setData(empty);
        userSrc.setData(empty);
      }
    }

    function activateNearMe(opts = {}) {
      const { silent = false } = opts;
      if (nearMe.pendingPrompt) return;
      // Insecure contexts (file:// or plain http on a non-localhost domain)
      // can't access geolocation. Mapbox's GeolocateControl already gates on
      // this; we mirror the same check so the failure mode is a clear toast
      // instead of a silent permission denial.
      if (!('geolocation' in navigator) || !window.isSecureContext) {
        if (!silent) showToast('Локацията изисква HTTPS — пробвай в реалния сайт.');
        return;
      }
      nearMe.pendingPrompt = true;
      _setNearTriggerState({ active: false, loading: true });
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          nearMe.pendingPrompt = false;
          nearMe.active = true;
          nearMe.lat = pos.coords.latitude;
          nearMe.lng = pos.coords.longitude;
          _setNearTriggerState({ active: true, loading: false });
          _drawNearOverlay();
          // Zoom so the radius polygon fits comfortably in the viewport.
          // 2 km radius at lat 43° fits well at zoom ~13.7.
          flyOrJump({ center: [nearMe.lng, nearMe.lat], zoom: 13.7 });
          applyFilters();
          syncUrlFromFilters();
          updateActiveFiltersUi();
        },
        (err) => {
          nearMe.pendingPrompt = false;
          _setNearTriggerState({ active: false, loading: false });
          if (silent) return;  // auto-fire on load: stay on city view silently
          const msg = err && err.code === 1
            ? 'Не получихме разрешение за локация. Пробвай пак или избери град.'
            : 'Не успяхме да открием локацията ти.';
          showToast(msg);
        },
        { enableHighAccuracy: false, timeout: 10000, maximumAge: 60000 }
      );
    }

    function deactivateNearMe() {
      nearMe.active = false;
      nearMe.lat = null;
      nearMe.lng = null;
      _setNearTriggerState({ active: false, loading: false });
      _drawNearOverlay();
    }

    function toggleNearMe() {
      if (nearMe.active || nearMe.pendingPrompt) {
        deactivateNearMe();
        applyFilters();
        syncUrlFromFilters();
        updateActiveFiltersUi();
      } else {
        activateNearMe();
      }
    }

    // ── URL ↔ FILTERS ───────────────────────────────────────────────────────

    function syncUrlFromFilters() {
      const url = new URL(location.href);
      const set = (k, v) => v ? url.searchParams.set(k, v) : url.searchParams.delete(k);

      set('q', FILTERS.q);
      set('cat', [...FILTERS.cats].map(c => CAT_SLUG[c] || c).join(','));
      set('sub', [...FILTERS.subcats].join(','));
      set('age', (FILTERS.ageFrom != null || FILTERS.ageTo != null)
        ? `${FILTERS.ageFrom ?? ''}-${FILTERS.ageTo ?? ''}` : '');
      set('tier', [...FILTERS.tiers].join(','));
      set('photo', FILTERS.photo ? '1' : '');
      set('sop', FILTERS.sop ? '1' : '');
      set('online', FILTERS.online ? '1' : '');
      set('top', FILTERS.top ? '1' : '');
      // Near-me URL flag — coordinates are deliberately NOT in the URL
      // (privacy). Re-loading the page with `?near=1` will re-prompt for
      // location.
      set('near', nearMe.active ? '1' : '');

      history.replaceState({ slug: currentSlug }, '', url);
      notifyParentFiltersChange();
    }

    function hydrateFiltersFromUrl() {
      const p = new URLSearchParams(location.search);
      FILTERS.q = p.get('q') || '';

      FILTERS.cats.clear();
      (p.get('cat') || '').split(',').filter(Boolean).forEach(slug => {
        const bg = CAT_SLUG_REVERSE[slug];
        if (bg) FILTERS.cats.add(bg);
      });

      FILTERS.subcats.clear();
      (p.get('sub') || '').split(',').filter(Boolean).forEach(s => {
        // Reject anything not in the known taxonomy — defends against
        // adversarial / stale URL params reaching FILTERS.
        if (ALL_SUBS.has(s)) FILTERS.subcats.add(s);
      });

      const clampAge = v => {
        if (v === '' || v == null) return null;
        const n = Math.floor(Number(v));
        if (!Number.isFinite(n)) return null;
        return Math.max(0, Math.min(18, n));
      };
      const age = p.get('age') || '';
      const m = age.match(/^(\d*)-(\d*)$/);
      let ageFrom = m ? clampAge(m[1]) : null;
      let ageTo = m ? clampAge(m[2]) : null;
      // Inverted range → swap so the filter doesn't silently kill all rows.
      if (ageFrom != null && ageTo != null && ageFrom > ageTo) {
        [ageFrom, ageTo] = [ageTo, ageFrom];
      }
      FILTERS.ageFrom = ageFrom;
      FILTERS.ageTo = ageTo;

      FILTERS.tiers.clear();
      (p.get('tier') || '').split(',').filter(Boolean).forEach(t => {
        if (TIERS_ORDER.includes(t)) FILTERS.tiers.add(t);
      });

      TOGGLE_KEYS.forEach(k => { FILTERS[k] = p.get(k) === '1'; });
      // Near-me re-prompt — only if the URL says so AND we don't already
      // have a fix. Wrapped in setTimeout so it runs after the map is ready.
      const wantsNear = p.get('near') === '1';
      if (wantsNear && !nearMe.active && !nearMe.pendingPrompt) {
        setTimeout(activateNearMe, 50);
      } else if (!wantsNear && nearMe.active) {
        deactivateNearMe();
      }
    }

    function notifyParentFiltersChange() {
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: 'zd:map:urlChange',
            search: location.search,
          }, location.origin);
        }
      } catch (_) { /* ignore */ }
    }

    // ── Filter panel UI ─────────────────────────────────────────────────────

    let filterPanelBuilt = false;
    let qDebounceTimer = null;
    let ageDebounceTimer = null;

    function buildFilterPanelChips() {
      if (filterPanelBuilt) return;
      filterPanelBuilt = true;
      // Категории
      const catsWrap = document.getElementById('fp-cats');
      catsWrap.innerHTML = Object.keys(CATEGORY_ROLLUP).map(cat =>
        `<button type="button" class="fp-chip" data-cat="${escapeHtml(cat)}" aria-pressed="false">${escapeHtml(cat)}</button>`
      ).join('');

      // Подкатегории — grouped, collapsed by default
      const subsWrap = document.getElementById('fp-subcats');
      subsWrap.innerHTML = Object.entries(CATEGORY_ROLLUP).map(([cat, subs]) =>
        `<details class="fp-subcat-group" data-parent="${escapeHtml(cat)}">
           <summary class="fp-subcat-summary">${escapeHtml(cat)}</summary>
           <div class="fp-subcat-row">
             ${subs.map(s => `<button type="button" class="fp-chip" data-sub="${escapeHtml(s)}" aria-pressed="false">${escapeHtml(s)}</button>`).join('')}
           </div>
         </details>`
      ).join('');

      // Tier chips
      const tiersWrap = document.getElementById('fp-tiers');
      tiersWrap.innerHTML = TIERS_ORDER.map(t =>
        `<button type="button" class="fp-chip" data-tier="${escapeHtml(t)}" aria-pressed="false">${escapeHtml(t)}</button>`
      ).join('');

      // Wire up chip clicks via delegation
      catsWrap.addEventListener('click', e => {
        const btn = e.target.closest('.fp-chip');
        if (!btn) return;
        const cat = btn.dataset.cat;
        if (FILTERS.cats.has(cat)) FILTERS.cats.delete(cat);
        else FILTERS.cats.add(cat);
        btn.setAttribute('aria-pressed', FILTERS.cats.has(cat) ? 'true' : 'false');
        applyFilters();
        syncUrlFromFilters();
      });
      subsWrap.addEventListener('click', e => {
        const btn = e.target.closest('.fp-chip');
        if (!btn) return;
        const sub = btn.dataset.sub;
        if (FILTERS.subcats.has(sub)) FILTERS.subcats.delete(sub);
        else FILTERS.subcats.add(sub);
        btn.setAttribute('aria-pressed', FILTERS.subcats.has(sub) ? 'true' : 'false');
        applyFilters();
        syncUrlFromFilters();
      });
      tiersWrap.addEventListener('click', e => {
        const btn = e.target.closest('.fp-chip');
        if (!btn) return;
        const tier = btn.dataset.tier;
        if (FILTERS.tiers.has(tier)) FILTERS.tiers.delete(tier);
        else FILTERS.tiers.add(tier);
        btn.setAttribute('aria-pressed', FILTERS.tiers.has(tier) ? 'true' : 'false');
        applyFilters();
        syncUrlFromFilters();
      });

      // Free-text input — debounced for snappier feel
      const qInput = document.getElementById('fp-q');
      qInput.addEventListener('input', () => {
        clearTimeout(qDebounceTimer);
        qDebounceTimer = setTimeout(() => {
          FILTERS.q = qInput.value.trim();
          applyFilters();
          syncUrlFromFilters();
        }, 220);
      });

      // Age inputs — `input` event with debounce so typing 1 → 5 doesn't
      // briefly filter to age 1, then re-filter to 5 a frame later.
      const ageFromEl = document.getElementById('fp-age-from');
      const ageToEl = document.getElementById('fp-age-to');
      const clampAgeStr = v => {
        if (v === '') return null;
        const n = Math.floor(Number(v));
        if (!Number.isFinite(n)) return null;
        return Math.max(0, Math.min(18, n));
      };
      const ageHandler = () => {
        clearTimeout(ageDebounceTimer);
        ageDebounceTimer = setTimeout(() => {
          let f = clampAgeStr(ageFromEl.value);
          let t = clampAgeStr(ageToEl.value);
          if (f != null && t != null && f > t) [f, t] = [t, f];
          FILTERS.ageFrom = f;
          FILTERS.ageTo = t;
          applyFilters();
          syncUrlFromFilters();
        }, 220);
      };
      ageFromEl.addEventListener('input', ageHandler);
      ageToEl.addEventListener('input', ageHandler);

      // Toggles
      TOGGLE_KEYS.forEach(key => {
        const el = document.getElementById(`fp-${key}`);
        el.addEventListener('change', () => {
          FILTERS[key] = el.checked;
          applyFilters();
          syncUrlFromFilters();
        });
      });

      // Footer + chrome buttons. The Apply button has to flush the q-input
      // debounce — otherwise hitting Apply <220ms after typing leaves the
      // filter unapplied even though the panel closes.
      function flushPendingDebounces() {
        if (qDebounceTimer) {
          clearTimeout(qDebounceTimer);
          qDebounceTimer = null;
          FILTERS.q = qInput.value.trim();
        }
        if (ageDebounceTimer) {
          clearTimeout(ageDebounceTimer);
          ageDebounceTimer = null;
          let f = clampAgeStr(ageFromEl.value);
          let t = clampAgeStr(ageToEl.value);
          if (f != null && t != null && f > t) [f, t] = [t, f];
          FILTERS.ageFrom = f;
          FILTERS.ageTo = t;
        }
        applyFilters();
        syncUrlFromFilters();
      }
      document.getElementById('fp-clear').addEventListener('click', () => clearFilters());
      document.getElementById('fp-apply').addEventListener('click', () => {
        flushPendingDebounces();
        closeFilterPanel();
      });
      document.getElementById('fp-close').addEventListener('click', () => {
        flushPendingDebounces();
        closeFilterPanel();
      });
      document.getElementById('filter-backdrop').addEventListener('click', () => {
        flushPendingDebounces();
        closeFilterPanel();
      });
      document.getElementById('filter-trigger').addEventListener('click', openFilterPanel);

      // Focus trap inside the dialog. Tab from the last focusable wraps to
      // the first; Shift+Tab from the first wraps to the last.
      const panel = document.getElementById('filter-panel');
      panel.addEventListener('keydown', (e) => {
        if (e.key !== 'Tab') return;
        const focusables = panel.querySelectorAll(
          'a[href], button, input:not([disabled]), [tabindex]:not([tabindex="-1"]), summary'
        );
        if (!focusables.length) return;
        const first = focusables[0];
        const last = focusables[focusables.length - 1];
        if (e.shiftKey && document.activeElement === first) {
          e.preventDefault();
          last.focus();
        } else if (!e.shiftKey && document.activeElement === last) {
          e.preventDefault();
          first.focus();
        }
      });
    }

    function syncFilterPanelInputs() {
      // Reflect current FILTERS state into the panel inputs (used after URL
      // hydration and after Clear All).
      const qInput = document.getElementById('fp-q');
      if (qInput) qInput.value = FILTERS.q;

      document.querySelectorAll('#fp-cats .fp-chip').forEach(b => {
        b.setAttribute('aria-pressed', FILTERS.cats.has(b.dataset.cat) ? 'true' : 'false');
      });
      document.querySelectorAll('#fp-subcats .fp-chip').forEach(b => {
        b.setAttribute('aria-pressed', FILTERS.subcats.has(b.dataset.sub) ? 'true' : 'false');
      });
      document.querySelectorAll('#fp-tiers .fp-chip').forEach(b => {
        b.setAttribute('aria-pressed', FILTERS.tiers.has(b.dataset.tier) ? 'true' : 'false');
      });

      const ageFrom = document.getElementById('fp-age-from');
      const ageTo = document.getElementById('fp-age-to');
      if (ageFrom) ageFrom.value = FILTERS.ageFrom != null ? FILTERS.ageFrom : '';
      if (ageTo) ageTo.value = FILTERS.ageTo != null ? FILTERS.ageTo : '';

      ['photo', 'sop', 'online'].forEach(key => {
        const el = document.getElementById(`fp-${key}`);
        if (el) el.checked = FILTERS[key];
      });

      // Auto-expand subcat groups whose parent is selected, so the active
      // подкатегории under it are visible at a glance.
      document.querySelectorAll('#fp-subcats .fp-subcat-group').forEach(d => {
        const parent = d.dataset.parent;
        const hasActiveChild = (CATEGORY_ROLLUP[parent] || []).some(s => FILTERS.subcats.has(s));
        if (FILTERS.cats.has(parent) || hasActiveChild) d.open = true;
      });
    }

    let filterPanelOpenLastFocus = null;
    function openFilterPanel() {
      const panel = document.getElementById('filter-panel');
      const backdrop = document.getElementById('filter-backdrop');
      const trigger = document.getElementById('filter-trigger');
      panel.hidden = false;
      backdrop.hidden = false;
      // Force reflow so the transition fires
      void panel.offsetWidth;
      panel.classList.add('is-open');
      backdrop.classList.add('is-open');
      trigger.setAttribute('aria-expanded', 'true');
      filterPanelOpenLastFocus = document.activeElement;
      // Focus the primary interaction (search input), not the close button.
      // Pattern matches Airbnb / Booking filter panels.
      const qInput = document.getElementById('fp-q');
      (qInput || document.getElementById('fp-close')).focus();
    }
    function closeFilterPanel() {
      const panel = document.getElementById('filter-panel');
      const backdrop = document.getElementById('filter-backdrop');
      const trigger = document.getElementById('filter-trigger');
      panel.classList.remove('is-open');
      backdrop.classList.remove('is-open');
      trigger.setAttribute('aria-expanded', 'false');
      // Wait for transition before hiding from the AT tree
      setTimeout(() => {
        if (!panel.classList.contains('is-open')) {
          panel.hidden = true;
          backdrop.hidden = true;
        }
      }, 240);
      if (filterPanelOpenLastFocus && filterPanelOpenLastFocus.focus) {
        filterPanelOpenLastFocus.focus();
      }
    }
    // Esc closes the panel
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      const panel = document.getElementById('filter-panel');
      if (panel && panel.classList.contains('is-open')) closeFilterPanel();
    });

    // ── Active filter pill row ──────────────────────────────────────────────

    // Active-filter pills use event delegation on the wrap. Each pill carries
    // a `data-key` (e.g. "cat:Спорт", "sub:Логопед", "age", "q", "photo")
    // that the single dispatcher below maps to a FILTERS mutation. Avoids
    // the index-array brittleness of the prior implementation.
    function buildAfPill(key, label) {
      const safe = escapeHtml(label);
      return `<button type="button" class="af-pill" data-key="${escapeHtml(key)}" aria-label="Премахни филтър ${safe}">${safe}<span class="af-x" aria-hidden="true">×</span></button>`;
    }

    function updateActiveFiltersUi() {
      const wrap = document.getElementById('active-filters');
      if (!wrap) return;
      const pills = [];

      if (FILTERS.q) {
        pills.push(buildAfPill('q', `„${FILTERS.q}"`));
      }
      // Stable order: iterate the rollup definition, not the Set's insertion
      // order — keeps pills in a predictable place across hydrate cycles.
      Object.keys(CATEGORY_ROLLUP).forEach(c => {
        if (FILTERS.cats.has(c)) pills.push(buildAfPill(`cat:${c}`, c));
      });
      Object.values(CATEGORY_ROLLUP).flat().forEach(s => {
        if (FILTERS.subcats.has(s)) pills.push(buildAfPill(`sub:${s}`, s));
      });
      if (FILTERS.ageFrom != null || FILTERS.ageTo != null) {
        const lo = FILTERS.ageFrom ?? '0';
        const hi = FILTERS.ageTo ?? '18';
        pills.push(buildAfPill('age', `${lo}-${hi} г.`));
      }
      TIERS_ORDER.forEach(t => {
        if (FILTERS.tiers.has(t)) pills.push(buildAfPill(`tier:${t}`, t));
      });
      if (nearMe.active)  pills.push(buildAfPill('near', `Близо до мен · ${NEAR_RADIUS_KM} км`));
      if (FILTERS.top)    pills.push(buildAfPill('top', 'Топ препоръки'));
      if (FILTERS.photo)  pills.push(buildAfPill('photo', 'Със снимка'));
      if (FILTERS.sop)    pills.push(buildAfPill('sop', 'СОП'));
      if (FILTERS.online) pills.push(buildAfPill('online', 'Онлайн'));

      if (!pills.length) {
        wrap.hidden = true;
        wrap.innerHTML = '';
        return;
      }
      wrap.hidden = false;
      wrap.innerHTML = pills.join('') + '<button type="button" class="af-clear" id="af-clear" aria-label="Изчисти всички филтри">Изчисти всички</button>';
    }

    // One-time delegated dispatcher — wired from the DOMContentLoaded init.
    function wireActiveFiltersDelegate() {
      const wrap = document.getElementById('active-filters');
      if (!wrap || wrap.dataset.wired) return;
      wrap.dataset.wired = '1';
      wrap.addEventListener('click', (e) => {
        const clearBtn = e.target.closest('#af-clear');
        if (clearBtn) { clearFilters(); return; }
        const pill = e.target.closest('.af-pill');
        if (!pill) return;
        const key = pill.dataset.key || '';
        const [type, value] = key.includes(':') ? key.split(/:(.+)/, 2) : [key, ''];
        switch (type) {
          case 'q':      FILTERS.q = ''; break;
          case 'cat':    FILTERS.cats.delete(value); break;
          case 'sub':    FILTERS.subcats.delete(value); break;
          case 'tier':   FILTERS.tiers.delete(value); break;
          case 'age':    FILTERS.ageFrom = null; FILTERS.ageTo = null; break;
          case 'photo':  FILTERS.photo = false; break;
          case 'sop':    FILTERS.sop = false; break;
          case 'online': FILTERS.online = false; break;
          case 'top':    FILTERS.top = false; break;
          case 'near':   deactivateNearMe(); break;
          default: return;
        }
        syncFilterPanelInputs();
        applyFilters();
        syncUrlFromFilters();
      });
    }

    async function selectCity(slug, { pushHistory } = {}) {
      if (!CITIES[slug]) slug = DEFAULT_CITY;
      currentSlug = slug;
      const city = CITIES[slug];

      if (pushHistory) {
        const url = new URL(location.href);
        url.searchParams.set('city', slug);
        history.replaceState({ slug }, '', url);
        notifyParentCityChange(slug);
      }

      updateTabsUi();
      updateCityPill();
      flyOrJump({ center: city.center, zoom: city.zoom });
      if (activePopup) { activePopup.remove(); activePopup = null; }
      // Boundary swap is independent of the pin fetch — kick it off in
      // parallel so the outline appears as fast as possible.
      if (layersAttached) setBoundaryFor(slug);

      // Clear previous city's data immediately so any in-flight chip clicks
      // during the load window don't apply filters to stale features.
      currentRawFeatures = [];
      if (layersAttached && !cityFeatureCache.has(slug)) setSourceData([]);

      // Cache hit — skip the Supabase round trip entirely.
      if (cityFeatureCache.has(slug)) {
        currentRawFeatures = cityFeatureCache.get(slug);
        if (!currentRawFeatures.length) {
          if (layersAttached) setSourceData([]);
          showEmptyState();
          updateStat(0);
          return;
        }
        hideEmptyState();
        applyFilters();
        return;
      }

      // Cancellation token — if the user taps another tab while this fetch is
      // in-flight, the later tap bumps the token and this resolved fetch is
      // discarded so its data never overwrites the newer city's pins.
      const myToken = ++currentLoadToken;
      const features = await loadBusinessesFor(city.bg);
      if (myToken !== currentLoadToken) return;

      if (features === null) {
        // Error: clear the previous city's pins so the user does not see a
        // phantom dataset on top of the wrong city.
        currentRawFeatures = [];
        if (layersAttached) setSourceData([]);
        hideEmptyState();
        updateStat(0);
        const loading = document.getElementById('loading');
        loading.hidden = false;
        loading.textContent = 'Картата не се зареди. Опитай пак.';
        return;
      }

      cityFeatureCache.set(slug, features);
      currentRawFeatures = features;

      if (!features.length) {
        if (layersAttached) setSourceData([]);
        showEmptyState();
        updateStat(0);
        return;
      }

      hideEmptyState();
      applyFilters();
    }

    function whenSupabaseReady() {
      return new Promise(resolve => {
        if (window.ZdSupabase) return resolve();
        window.addEventListener('zd-supabase-ready', () => resolve(), { once: true });
      });
    }

    map.on('load', async () => {
      // Tabs + pill are already wired from DOMContentLoaded; just refresh
      // in case the Mapbox bundle finished loading before DOMContentLoaded fired.
      if (!document.getElementById('city-tabs').children.length) buildCityTabs();
      updateCityPill();
      await whenSupabaseReady();
      await attachLayers();
      // Initial boundary fetch — runs in parallel with the pin fetch below.
      setBoundaryFor(currentSlug);

      const city = CITIES[currentSlug];
      const myToken = ++currentLoadToken;
      const features = await loadBusinessesFor(city.bg);
      if (myToken !== currentLoadToken) return;

      const loading = document.getElementById('loading');

      if (features === null) {
        // Don't clobber the auth-failure banner if the map error handler
        // already latched it — that message is more useful for the dev
        // than the generic "пак опитай" string.
        if (!_zdMapErrorBannerShown) {
          loading.textContent = 'Картата не се зареди. Опитай пак.';
        }
        return;
      }

      // Same guard: if the Mapbox 401 banner is up, leave it visible.
      if (loading && !_zdMapErrorBannerShown) loading.hidden = true;

      cityFeatureCache.set(currentSlug, features);
      currentRawFeatures = features;

      if (!features.length) {
        showEmptyState();
        updateStat(0);
        return;
      }

      applyFilters();

      // Auto-zoom to user's location with a 2 km radius on first paint.
      // Silent — if permission is denied or geolocation fails, the user
      // stays on the default city view instead of seeing a toast. Only
      // fires once per page load (subsequent city tab clicks don't
      // re-prompt).
      activateNearMe({ silent: true });
    });

    // Browser back/forward → re-sync city AND filters from the URL.
    window.addEventListener('popstate', () => {
      hydrateFiltersFromUrl();
      syncFilterPanelInputs();
      const slug = citySlugFromUrl();
      if (slug !== currentSlug) {
        selectCity(slug, { pushHistory: false });
      } else {
        applyFilters();
      }
    });
  </script>
</body>
</html>
