<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" role="img" aria-label="Национален Регистър За Детето">
  <defs>
    <!-- Icon gradients (lifted from zadeteto-app-icon-1024.svg so the
         wordmark stays self-contained and doesn't depend on a second
         external asset). -->
    <linearGradient id="pMain" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0%"   stop-color="#b388ff"/>
      <stop offset="40%"  stop-color="#9c5fff"/>
      <stop offset="100%" stop-color="#7c4dff"/>
    </linearGradient>
    <linearGradient id="cMain" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0%"   stop-color="#ffe082"/>
      <stop offset="45%"  stop-color="#f5d76e"/>
      <stop offset="100%" stop-color="#d4a843"/>
    </linearGradient>
    <linearGradient id="zd-text-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#7c4dff"/>
      <stop offset="100%" stop-color="#5a2ee6"/>
    </linearGradient>
    <linearGradient id="zd-gold" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%"   stop-color="#b88a1a" stop-opacity="0"/>
      <stop offset="20%"  stop-color="#e8c547" stop-opacity="1"/>
      <stop offset="80%"  stop-color="#e8c547" stop-opacity="1"/>
      <stop offset="100%" stop-color="#b88a1a" stop-opacity="0"/>
    </linearGradient>
    <style>
      .zd-line-1 {
        font-family: 'Manrope', -apple-system, 'Segoe UI', sans-serif;
        font-weight: 700;
        font-size: 23px;
        letter-spacing: 0;
        fill: #45425a;
      }
      .zd-line-2 {
        font-family: 'Manrope', -apple-system, 'Segoe UI', sans-serif;
        font-weight: 800;
        font-size: 36px;
        letter-spacing: -0.01em;
        fill: url(#zd-text-purple);
      }
    </style>
  </defs>

  <!-- ICON: purple rounded square with gold disc + white accents.
       Scaled and translated to fit at the left edge of the wordmark. -->
  <g transform="translate(8 12) scale(0.8)">
    <rect x="5" y="5" width="110" height="110" rx="24" fill="url(#pMain)"/>
    <circle cx="75" cy="75" r="28" fill="url(#cMain)" opacity=".95"/>
    <circle cx="60" cy="65" r="10" fill="rgba(255,255,255,.1)"/>
    <circle cx="85" cy="58" r="2" fill="rgba(255,255,255,.55)"/>
    <circle cx="90" cy="64" r="1.3" fill="rgba(255,255,255,.3)"/>
  </g>

  <!-- TEXT block, left-aligned starting at x=118 (just right of the icon).
       Line 1 promoted to 26px so the full brand name reads as a peer to
       "За Детето", not a small caption above it. -->
  <text x="118" y="46" text-anchor="start" class="zd-line-1">
    Национален Регистър
  </text>

  <!-- Thin gold accent rule between the two text lines, sized to match
       the left edge of the text and the approximate width of line 1. -->
  <rect x="118" y="58" width="220" height="2" rx="1" fill="url(#zd-gold)"/>

  <text x="118" y="98" text-anchor="start" class="zd-line-2">
    За Детето
  </text>
</svg>
