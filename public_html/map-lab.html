  :root {
    --zd-purple: #7c4dff;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;

    display: flex;

  h1, h2, h3 { font-family: 'DM Serif Display', serif; }

  main {

  /* Iframe fills the viewport below the nav. dvh handles the iOS Safari
     dynamic toolbar; vh is the fallback for older browsers. */

    display: block;
    width: 100%;
    height: calc(100vh - var(--nav-h));
    height: calc(100dvh - var(--nav-h));

  }

<script>
(function () {
  // Forward the wrapper's filter-related query string into the iframe's src so
  // direct deep-links (`/map.html?city=plovdiv&cat=specialisti&tier=Доверен`)
  // load the right view on first paint.
  const iframe = document.getElementById('map-iframe');
  const CITY_SLUG_RE = /^[a-z0-9-]+$/i;
  // Allow-list of params we forward — anything else stays on the wrapper URL
  // and is ignored by the iframe.
  const FORWARD_KEYS = ['city', 'q', 'cat', 'sub', 'tier', 'age', 'photo', 'sop', 'online', 'top', 'near'];

  const wrapperParams = new URLSearchParams(location.search);
  const u = new URL(iframe.src, location.href);
  let mutated = false;
  FORWARD_KEYS.forEach(k => {
    const v = wrapperParams.get(k);
    if (v == null) return;
    if (k === 'city' && !CITY_SLUG_RE.test(v)) return;
    u.searchParams.set(k, v);
    mutated = true;
  });
  if (mutated) iframe.src = u.pathname + u.search;

  // When the embed page reports a state change, sync the wrapper URL so
  // refresh / share keeps the same view. Two message types:
  //   - zd:map:cityChange { slug }            → only updates ?city=
  //   - zd:map:urlChange  { search }          → updates the full filter set
  window.addEventListener('message', (e) => {
    // Defence in depth — both source and origin must be the trusted iframe.
    if (e.source !== iframe.contentWindow) return;
    if (e.origin !== location.origin) return;
    const data = e.data;
    if (!data || typeof data !== 'object') return;

    if (data.type === 'zd:map:cityChange' && typeof data.slug === 'string' && CITY_SLUG_RE.test(data.slug)) {
      const url = new URL(location.href);
      if (url.searchParams.get('city') === data.slug) return;
      url.searchParams.set('city', data.slug);
      history.replaceState(null, '', url);
      return;
    }

    if (data.type === 'zd:map:urlChange' && typeof data.search === 'string') {
      // Defence-in-depth: don't trust the iframe's search string verbatim.
      // Re-parse it, validate each key against the FORWARD_KEYS allow-list,
      // and rebuild the wrapper URL from those alone. A bug or compromise on
      // the embed side cannot inject extra params into the parent URL.
      const incoming = new URLSearchParams(data.search);
      const url = new URL(location.href);
      // Wipe any allow-listed params first (so a removed filter is reflected),
      // then re-set from the validated incoming string.
      FORWARD_KEYS.forEach(k => url.searchParams.delete(k));
      FORWARD_KEYS.forEach(k => {
        const v = incoming.get(k);
        if (v == null) return;
        if (k === 'city' && !CITY_SLUG_RE.test(v)) return;
        url.searchParams.set(k, v);
      });
      history.replaceState(null, '', url);
    }
  });
})();
</script>
